{% extends "base.html" %}

{% block title %}Reset Password - Dream Career Explorer{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="zoom-in">
            <div class="glass-card">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-key fs-1 text-primary mb-2"></i>
                    <h3 class="fw-bold">Password Recovery</h3>
                    <p class="text-secondary" style="font-size: 0.9rem;">Simulate reset code and change your password.</p>
                </div>
                
                <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary" style="font-size: 0.9rem;">Enter Your Registered Email</label>
                        <input type="email" name="email" class="form-control-custom" placeholder="john@example.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary" style="font-size: 0.9rem;">Enter New Password</label>
                        <input type="password" name="password" class="form-control-custom" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
                    </div>
                    
                    <button type="submit" class="glow-btn w-100 py-3 mb-3"><i class="fa-solid fa-sync me-2"></i> Reset Password</button>
                    
                    <p class="text-center text-secondary mb-0" style="font-size: 0.9rem;">
                        Back to <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign In</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
