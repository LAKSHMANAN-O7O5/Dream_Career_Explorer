{% extends "base.html" %}

{% block title %}{{ blog.title }} - Dream Career Explorer{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8" data-aos="fade-up">
            <a href="{{ url_for('main.blogs') }}" class="btn btn-outline-secondary btn-sm text-light border-color mb-4"><i class="fa-solid fa-arrow-left"></i> Back to Guides</a>
            
            <article class="glass-card">
                <!-- Meta tags -->
                <div class="d-flex align-items-center gap-3 mb-3" style="font-size: 0.85rem;">
                    <span class="badge-custom badge-tech">{{ blog.tags or 'Career Guidance' }}</span>
                    <span class="text-secondary"><i class="fa-solid fa-clock me-1"></i> {{ blog.read_time }} min read</span>
                    <span class="text-muted">{{ blog.created_at.strftime('%d %b %Y') }}</span>
                </div>
                
                <!-- Title -->
                <h1 class="fw-bold mb-4 text-light" style="line-height: 1.3;">{{ blog.title }}</h1>
                
                <hr class="border-color my-4">
                
                <!-- Content body -->
                <div class="text-secondary" style="line-height: 1.8; font-size: 1.05rem; text-align: justify; white-space: pre-line;">
                    {{ blog.content }}
                </div>
            </article>
        </div>
    </div>
</div>
{% endblock %}
